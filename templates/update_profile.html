<!DOCTYPE html>
<html>

<head>
    <title>Update Profile</title>
    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #f1f5f9;
        }

        .card {
            max-width: 420px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        .flash-container {
            position: fixed;
            top: 80px;
            right: 560px;
            z-index: 9999;
        }

        .flash {
            min-width: 260px;
            margin-bottom: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.4s ease;
        }

        /* Success */
        .flash-success {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        /* Error */
        .flash-error {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        /* Warning */
        .flash-warning {
            background: linear-gradient(135deg, #d97706, #f59e0b);
        }

        /* Default */
        .flash-message {
            background: #334155;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    {% include "nav.html" %}

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="card">
        <h2>Update Account</h2>
        <form method="POST">
            <label>
                <input type="text" name="username" value="{{ user.username }}" required>
            </label>
            <label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </label>
            <label><input type="text" name="ph_number" value="{{ user.ph_number }}" required>
            </label>
            <button type="submit">Update</button>
        </form>
    </div>
    <script>
        setTimeout(() => {
            document.querySelectorAll('.flash').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(100%)';
                setTimeout(() => el.remove(), 400);
            });
        }, 4000);
    </script>
</body>

</html>
