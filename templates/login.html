<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        div {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
        }

        form input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        form button {
            width: 95%;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 17px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s ease;
        }

        form button:hover {
            background: #0056b3;
        }

        a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            font-size: 14px;
            color: #007bff;
        }

        a:hover {
            text-decoration: underline;
        }

        .flash-container {
            position: fixed;
            top: 80px;
            right: 560px;
            z-index: 9999;
        }

        .flash {
            min-width: 260px;
            margin-bottom: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.4s ease;
        }

        /* Success */
        .flash-success {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        /* Error */
        .flash-error {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        /* Warning */
        .flash-warning {
            background: linear-gradient(135deg, #d97706, #f59e0b);
        }

        /* Default */
        .flash-message {
            background: #334155;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>

</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div>
        <h2>Welcome to event management</h2>
        <form method="POST">
            <input type="hidden" name="next" value="{{ next }}">

            <input type="email" name="email" placeholder="email" required>
            <input type="password" name="password" placeholder="password" required>
            <button type="submit">Login</button>
            <a href="/register">Don't have a account?</a>
        </form>
    </div>
    <script>
        setTimeout(() => {
            document.querySelectorAll('.flash').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(100%)';
                setTimeout(() => el.remove(), 400);
            });
        }, 4000);
    </script>

</body>

</html>
