<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <style>
        /* ===== Reset ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== Body ===== */
        body {
            font-family: "Poppins", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== Form Container ===== */
        form {
            background-color: #ffffff;
            padding: 35px 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        /* ===== Heading ===== */
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
            color: #1e293b;
        }

        /* ===== Inputs ===== */
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #cbd5f5;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        /* ===== Button ===== */
        button {
            width: 100%;
            padding: 12px;
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
        }

        /* ===== Login Link ===== */
        form a {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        form a:hover {
            color: #0284c7;
            text-decoration: underline;
        }


        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            form {
                padding: 28px 24px;
            }

            h2 {
                font-size: 24px;
            }
        }

        .flash-container {
            position: fixed;
            top: 80px;
            right: 630px;
            z-index: 9999;
        }

        .flash {
            min-width: 260px;
            margin-bottom: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.4s ease;
        }

        /* Success */
        .flash-success {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        /* Error */
        .flash-error {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        /* Warning */
        .flash-warning {
            background: linear-gradient(135deg, #d97706, #f59e0b);
        }

        /* Default */
        .flash-message {
            background: #334155;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

 {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="/register" novalidate>
        <h2>Register</h2>

        <input type="text" name="username" placeholder="Username" required><br><br>

        <input type="email" name="email" placeholder="Email" required><br><br>

        <input type="password" name="password" placeholder="Password" required><br><br>

        <input type="tel" 
        name="ph_number" 
        placeholder="Phone Number" 
        pattern="[6-9] [0-9] {9}" 
        maxlength="10" 
        minlength="10"
        inputmode="numeric"
        title="Enter a valid 10 digit mobile number"
        required><br><br>

        <button type="submit">Register</button>

        <a href="/login"> aldredy have account ?</a>

    </form>
<script>
        setTimeout(() => {
            document.querySelectorAll('.flash').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(100%)';
                setTimeout(() => el.remove(), 400);
            });
        }, 4000);
    </script>
</body>

</html>
