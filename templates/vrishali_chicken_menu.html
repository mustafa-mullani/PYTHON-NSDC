<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hmr chicken menu</title>

    <style>
        /* Page background */
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Main container (MATCHES HTML CLASS) */
        .menue-contener {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* Title */
        .menue-contener h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        /* Section blocks */
        .radio-btn {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
        }

        /* Section heading */
        .radio-btn h3 {
            margin-bottom: 15px;
            color: #34495e;
            border-bottom: 2px solid #27ae60;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Radio item layout */
        .radio-btn label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        /* Hover effect */
        .radio-btn label:hover {
            background: #eafaf1;
        }

        /* Radio buttons */
        .radio-btn input[type="radio"] {
            accent-color: #27ae60;
            transform: scale(1.1);
        }

        /* Submit Button Styling */
        button {
            margin: 30px auto 0;
            display: block;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 30px;
            padding: 14px 50px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(39, 174, 96, 0.35);
            transition: all 0.3s ease;
        }

        /* Hover effect */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(39, 174, 96, 0.45);
            background: linear-gradient(135deg, #219150, #27ae60);
        }

        /* Active effect */
        button:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        /* Focus accessibility */
        button:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.25);
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .menue-contener {
                padding: 20px;
            }

            button {
                width: 100%;
                padding: 14px 0;
                border-radius: 12px;
            }
        }
    </style>


    <link rel="stylesheet" href="{{ url_for('static', filename='voice-assistant.css') }}">
    <script src="{{ url_for('static', filename='voice-assistant.js') }}" defer></script>
</head>

<body>
    <form method="POST">
        <div class="menue-contener">
            <h2>Select Menu</h2>
            <div class="radio-btn">
                <h3>Chicken Starters</h3>
                <label>
                    <input type="radio" name="chicken_starters" value="Chicken tikka" required>
                    Chicken tikka
                </label>

                <label>
                    <input type="radio" name="chicken_starters" value="Chicken Banjara Kebab">
                    Chicken Banjara Kebab
                </label>

                <label>
                    <input type="radio" name="chicken_starters" value="Chicken Pahadi Kebab">
                    Chicken Pahadi Kebab
                </label>

                <label>
                    <input type="radio" name="chicken_starters" value="Chicken Multani Kebab">
                    Chicken Multani Kebab
                </label>

                <label>
                    <input type="radio" name="chicken_starters" value="Chicken Chilly">
                    Chicken Chilly
                </label>

                <label>
                    <input type="radio" name="chicken_starters" value="Chicken 65">
                    Chicken 65
                </label>
            </div>

            <div class="radio-btn">
                <h3>Chicken Soup</h3>
                <label>
                    <input type="radio" name="chicken_soup" value="Chicken Manchow Soup" required>
                    Chicken Manchow Soup
                </label>

                <label>
                    <input type="radio" name="chicken_soup" value="Chicken Hot & Sour Soup">
                    Chicken Hot & Sour Soup
                </label>

                <label>
                    <input type="radio" name="chicken_soup" value="Chicken Clear Soup">
                    Chicken Clear Soup
                </label>
            </div>

            <div class="radio-btn">
                <h3>Chicken Main Course</h3>
                <label>
                    <input type="radio" name="chicken_main_course" value="Chicken Handi" required>
                    Chicken Handi
                </label>

                <label>
                    <input type="radio" name="chicken_main_course" value="Murg Musallam">
                    Murg Musallam
                </label>

                <label>
                    <input type="radio" name="chicken_main_course" value="Butter Chicken">
                    Butter Chicken
                </label>

                <label>
                    <input type="radio" name="chicken_main_course" value="Chicken Masala">
                    Chicken Masala
                </label>

                <label>
                    <input type="radio" name="chicken_main_course" value="Chicken Hydrabadi">
                    Chicken Hydrabadi
                </label>

                <label>
                    <input type="radio" name="chicken_main_course" value="Chicken Kolhaouri">
                    Chicken Kolhaouri
                </label>
            </div>

            <div class="radio-btn">
                <h3>Rice</h3>
                <label>
                    <input type="radio" name="c_rice" value="Steam Rice">
                    Steam Rice
                </label>
                <label>
                    <input type="radio" name="c_rice" value="Jeera Rice">
                    Jeera Rice
                </label>
                <label>
                    <input type="radio" name="c_rice" value="Biryani Rice">
                    Biryani Rice
                </label>
            </div>

            <div class="radio-btn">
                <h3>Raita</h3>
                <label>
                    <input type="radio" name="c_raita" value="Green Salad">
                    Green Salad
                </label>
                <label>
                    <input type="radio" name="c_raita" value="Boondhi Raita">
                    Boondhi Raita
                </label>
                <label>
                    <input type="radio" name="c_raita" value="Mix Veg Raita">
                    Mix Veg Raita
                </label>
            </div>

            <div class="radio-btn">
                <h3>Dessert</h3>
                <label>
                    <input type="radio" name="c_dessert" value="Gulab Jamun">
                    Gulab Jamun
                </label>
                <label>
                    <input type="radio" name="c_dessert" value="Amrakhand">
                    Amrakhand
                </label>
                <label>
                    <input type="radio" name="c_dessert" value="Fruitkhand">
                    Fruitkhand
                </label>
                <label>
                    <input type="radio" name="c_dessert" value="Ice-Cream">
                    Ice-Cream
                </label>
                <label>
                    <input type="radio" name="c_dessert" value="Shrikhand">
                    Shrikhand
                </label>
            </div>
            <button type="submit">Next</button>
        </div>


    </form>
</body>

</html>
