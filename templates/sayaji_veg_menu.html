<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        /* Page background */
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Main container */
        .radio-contener {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* Title */
        .radio-contener h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        /* Section blocks */
        .radio-btn {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
        }

        /* Section heading */
        .radio-btn h3 {
            margin-bottom: 15px;
            color: #34495e;
            border-bottom: 2px solid #27ae60;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Radio item layout */
        .radio-btn label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        /* Hover effect */
        .radio-btn label:hover {
            background: #eafaf1;
        }

        /* Radio buttons */
        .radio-btn input[type="radio"] {
            accent-color: #27ae60;
            transform: scale(1.1);
        }

        /* Submit Button Styling */
        button {
            margin: 30px auto 0;
            display: block;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 30px;
            padding: 14px 50px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(39, 174, 96, 0.35);
            transition: all 0.3s ease;
        }

        /* Hover effect */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(39, 174, 96, 0.45);
            background: linear-gradient(135deg, #219150, #27ae60);
        }

        /* Active (click) effect */
        button:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        /* Focus accessibility */
        button:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.25);
        }

        /* Mobile friendly */
        @media (max-width: 600px) {
            button {
                width: 100%;
                padding: 14px 0;
                border-radius: 12px;
            }
        }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='voice-assistant.css') }}">

</head>
